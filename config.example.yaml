# ==============================================================================
# OneCastRouter (OCR) & FinOps Gateway Configuration
# ==============================================================================
# Notice: Upstream providers, model catalogs, credentials, and pricing models
# are dynamically synchronized in real-time from the local OpenCode v2 daemon!
# There is no need to manually hardcode any providers or models list here.
# ==============================================================================

# Server listening configuration
port: 3000
host: "0.0.0.0"
# adminApiKey: "your-gateway-secret-token" # Optional: Bearer token protecting the gateway

# Local OpenCode daemon connection (Optional)
# Automatically reads ~/.config/opencode/service.json or OPENCODE_SERVER_URL environment variable by default
opencode:
  # url: "http://127.0.0.1:49374"
  # password: "your-service-password"

# Outbound proxy policy (Optional) — applies to upstream model calls, Layer2
# judge, and catalog/logo sync. Loopback targets (localhost / 127.0.0.1 / ::1)
# are NEVER proxied. Resolution: excludes (force direct) -> includes (non-empty:
# only matches proxied) -> url -> direct. With nothing configured,
# HTTP_PROXY/HTTPS_PROXY env vars still apply (Bun fetch behavior).
# Patterns match `provider/model` and the bare model id:
#   "anthropic/*"  -> provider level (all models of a provider)
#   "*/claude-*"   -> model level within any provider
#   "claude-*"     -> bare model-id match (no wildcard = substring)
# proxy:
#   enabled: false                   # master switch (default false; set true to activate)
#   url: "http://127.0.0.1:7890"     # global default proxy (empty = direct)
#     # ^ authenticated proxy: "http://user:pass@127.0.0.1:7890"
#     #   (sent as Proxy-Authorization, CONNECT included; URL-encode special chars)
#   includes:                         # non-empty: ONLY matches go through proxy
#     - "anthropic/*"
#     - "*/gpt-*"
#   excludes:                         # matches force direct (checked before includes)
#     - "deepseek/*"

# Inbound forward proxy (HTTP_PROXY / HTTPS_PROXY server) — FULL CAPTURE by design:
# every proxied TLS connection is MITM'd via a locally generated CA; decrypted
# LLM-protocol traffic (…/v1/chat/completions · …/v1/messages · …/v1/responses)
# is routed through this gateway, everything else is forwarded transparently.
# Only loopback targets and bypassHosts matches are blind-tunneled (never
# decrypted). The generated CA (<caDir>/ca.pem) must be trusted by the clients
# that use this proxy — export it from the console Proxy Access page. Restart required.
# forwardProxy:
#   enabled: false
#   port: 4555                      # clients: HTTP_PROXY=http://127.0.0.1:4555
#   host: "127.0.0.1"
#   bypassHosts:                    # glob patterns → pure tunnel (never decrypted)
#     - "*.internal"                #   bare string → tunnel DIRECT
#     - host: "api.openai.com"      #   object form → per-host egress choice
#       viaProxy: true              #   tunnel VIA the outbound proxy policy
#   caDir: ""                       # default: ~/.onecast-router/forward-proxy
#   viaOutboundProxy: false         # non-bypass forwards (non-intercepted GETs etc.) egress via config.proxy

# Tier membership  — each tier's candidate pool is an EXPLICIT
# `members` list; list order = priority / failover-chain order. A rule's
# `pattern` is a glob over the FULL model id (provider/model): `*` any chars,
# `?` one char, case-insensitive; NO wildcard = substring match; a full id
# pins exactly one model. Optional per-rule fields:
#   weight    — >= 1, default 1 (reserved for weighted / round_robin selection)
#   effortMap — thinking-level translation (client requested → upstream value),
#               e.g. { none: high, low: high }: mapped keys are translated,
#               unmapped levels pass through; capability clamps afterwards and
#               the actual served level is reported via X-OCR-Thinking-* headers.
# A model matching NO rule is 'unclassified' (joins no pool; still callable by
# id / combo). The block below IS the shipped default (DEFAULT_CONFIG.tiers,
# written verbatim into a brand-new config.yaml on first run): FOUR EMPTY
# pools — no member glob ships, nothing is seeded at runtime, and `auto`
# cannot route until you add members (console /tiers page, effective on save,
# no restart; deleting the whole `tiers:` section restores these empty
# defaults on the next load).
tiers:
  lite: {}
  plus: {}
  pro: {}
  ultra: {}
# Example — one glob per tier over the four Claude model families
# (lite→ultra: haiku / sonnet / opus / fable); uncomment to adopt:
# tiers:
#   lite:
#     members:
#       - pattern: "*haiku*"
#       # append your own rules below the example glob, e.g.
#       # - pattern: "anthropic/claude-haiku-4.5"   # full id = exactly one model
#       #   effortMap: { none: "high", low: "high" }
#   plus:
#     members:
#       - pattern: "*sonnet*"
#   pro:
#     members:
#       - pattern: "*opus*"
#   ultra:
#     members:
#       - pattern: "*fable*"

# Legacy smart-match (DEPRECATED for routing) — kept ONLY as
# the suggestion engine: catalog-page recommendations and the /tiers
# preview/save-time checks still consult these rules
# (price bands over the raw catalog $/M input price; a model matching NO band
# or with no price is 'unclassified'). Shown as the BUILT-IN defaults;
# uncomment + edit to steer the suggestions.
# tiers:
#   lite:
#     match:
#       maxInputPerM: 0.8
#   plus:
#     match:
#       minInputPerM: 0.8
#       maxInputPerM: 3
#   pro:
#     match:
#       minInputPerM: 3
#       maxInputPerM: 8
#   ultra:
#     match:
#       minInputPerM: 8

# Token Saver compression (Optional) — three independent engines (rtk /
# headroom / caveman), all fail-open (on any error the original request
# flows upstream unchanged). Restart required.
# compression:
#   enabled: true                     # master switch (default true; per-engine flags apply)
#   rtk:
#     enabled: false                  # compress tool-result text (git/grep/ls/tree/logs/build
#                                     #   output) via local deterministic compressors;
#                                     #   byte-stable across turns → upstream prefix cache safe
#   headroom:
#     enabled: false                  # whole-context compression via headroom sidecar /v1/compress
#     url: "http://127.0.0.1:8787"    # install: pip install "headroom-ai[all]" (PyPI only; npm pkg is SDK-only),
#                                     #   then run `headroom proxy --port 8787` yourself; loopback-only by default
#                                     #   docs: https://docs.headroomlabs.ai/docs/quickstart
#     timeoutMs: 3000                 # on timeout/error → original messages go upstream
#     compressUserMessages: false     # also compress user-role text (ignored in session mode)
#   caveman:
#     enabled: false                  # terse-style system-prompt injection → fewer output tokens
#     level: "full"                   # lite / full / ultra / wenyan-lite / wenyan / wenyan-ultra

# Dynamic domain rules extension (Optional)
# The gateway has built-in language-agnostic structural, syntax, and statistical features.
# You can extend custom routing regex rules for specific domain terms:
rules:
  - name: "formal_proof"
    pattern: "(proof|theorem|np-hard|np-complete|induction|contradiction)"
    tier: "pro"                      # Options: 'lite' | 'plus' | 'pro' | 'ultra'
    reason: "Formal theorem or mathematical proof query"
  - name: "system_architecture"
    pattern: "(architecture|microservice|distributed|concurrency|scalability)"
    tier: "plus"                      # Options: 'lite' | 'plus' | 'pro' | 'ultra'
    reason: "System architecture or distributed software engineering query"

# Routing mode (Optional)
routing:
  mode: "smart"                     # smart = classifier cascade (default) | cost = always lite | quality = always pro

# Cascading fallback and static schema assertion
fallback:
  enabled: true
  maxRetries: 1                     # Lite tier model attempts first; silent escalation if assertion fails
  escalateTier: "plus"              # Target tier upon validation failure ('plus' | 'pro' | 'ultra')
  injectErrorContext: true          # Injects parsing error context to guide plus-tier model to fix in one shot

# ==============================================================================
# Layer 2 Classification (System One judge)
# ==============================================================================
classifier:
  # Layer 2: Dedicated context-aware decision model, called over the
  # gateway's OWN System One protocol (POST /v1/systemone) — no vendor SDK,
  # no vendor endpoint. ANY registered model id serves it: a `type: systemone`
  # provider passes through natively, a chat model via protocol conversion.
  layer2:
    enabled: false                  # Enable Layer 2 dedicated judge model
    model: "auto"                   # Registered model id; 'auto' = systemone.defaultModel
    timeoutMs: 1500                 # Decision timeout in ms (falls back to the plus baseline on timeout)
    collectEnabled: false           # Dataset sampling: judged decisions -> data/layer2-decisions.jsonl for
                                    # future decision-model distillation. SINGLE-key gate (no capture master
                                    # involved), hot-applied on save. 64MB cap then writes pause with one warning.
                                    # state carries user conversation content — off by default.
                                    # (Moved from the retired classifier.layer2.decisionCapture — old key ignored.)

# ==============================================================================
# Request Capture (full request/response body audit log, OPT-IN)
# ==============================================================================
# Archives every orchestrated turn (success AND failure) as append-only JSONL:
#   <dir>/<YYYY-MM-DD>/<sessionId>.jsonl   (local-timezone date directories)
# Browse in the console at /captures. Retention sweeps whole date directories
# at boot + hourly. Request headers are NEVER recorded.
# WARNING: captured bodies may contain sensitive data; the console /api/ui/*
# endpoints are auth-exempt. Enable consciously.
requestCapture:
  enabled: false                    # Master switch — off by default; the sub-switches below only matter when on
  # dir: ""                         # Archive root; default = the active environment's envs/<env>/capture
  retentionDays: 7                  # Date dirs older than today-N are deleted
  maxTotalMB: 512                   # Oldest date dirs deleted first when exceeded
  maxBodyBytes: 65536               # Per-body truncation budget (request & response separately)
  systemone:
    enabled: true                   # System One surface MASTER — off silences BOTH legs at once:
                                    # the surface's own FULL-CHAIN capture below (client pair +
                                    # upstream pair) AND the judge-call capture
                                    # (sub). Needs requestCapture.enabled.
    l2DecisionEnabled: true         # JUDGE-CALL capture sub-switch — effective only when systemone.enabled is
                                    # true: the decision-model HTTP leg the Layer 2 judge
                                    # fires inside a routed chat turn, recorded as upstream-direction
                                    # events on the OUTER request's session/trace (purpose 'l2-judge').
                                    # Adds the judge's own wire call; never re-filters client traffic.
                                    # NOT the dataset-sampling switch —
                                    # that is classifier.layer2.collectEnabled (a different setting).

# ==============================================================================
# Multi-Turn Monotonic Session Ratchet & KV Cache Protection 
# ==============================================================================
session:
  enabled: true                     # Enable monotonic ratchet and upstream KV cache protection
  strategy: "monotonic"             # Options: 'monotonic' (escalate-only, industry gold standard) | 'sticky' | 'stateless'
  ttlSeconds: 3600                  # Session time-to-live in seconds (default 1 hour)
  maxSessions: 10000                # Maximum concurrent active sessions in memory LRU cache

# ==============================================================================
# Industrial-Grade Circuit Breaker & Health Management 
# ==============================================================================
circuitBreaker:
  enabled: true                     # Enable Circuit Breaker and proactive upstream fault isolation
  failureThreshold: 3               # Trip breaker after 3 consecutive 5xx/network failures
  slidingWindowSize: 20             # Request sliding window size for calculating failure rate
  failureRateThreshold: 0.5         # Trip breaker if error rate exceeds 50% in sliding window
  initialCooldownMs: 30000          # Initial cooldown duration in ms (30 seconds)
  maxCooldownMs: 18000000           # Maximum cooldown cap (5 hours: handles multi-hour major upstream outages)
  cooldownMultiplier: 2.0           # Exponential backoff multiplier for consecutive outage periods
  quotaCooldownMs: 43200000         # Hard-trip cooldown for 402/insufficient quota errors (12 hours)
  halfOpenMaxProbes: 1              # Maximum canary requests permitted during HALF_OPEN recovery trial
  activeProbing:
    enabled: false                  # Background active health probing for tripped models
    intervalMs: 60000               # Health check interval in ms (1 minute)

# ==============================================================================
# Cost-Aware Resilience & Hierarchical Retry 
# ==============================================================================
retry:
  enabled: true                     # Enable two-tier cost-aware retry strategy
  # Tier 1: In-Place Retry (Preserve Upstream KV Prompt Cache, Prevent 10x Cost Explosion)
  inplace:
    enabled: true                   # Enable in-place retry on the same model for transient network jitter
    maxAttempts: 1                  # Max in-place attempts (1 retry solves ~70% gateway blips & saves KV cache)
    backoffMs: 200                  # Initial backoff duration in ms
    jitterMs: 100                   # Random jitter in ms to avoid thundering herd
    maxRateLimitWaitMs: 2000        # Max wait for short 429 bursts (<= 2s wait in-place saves KV cache; > 2s triggers immediate failover AND a hard circuit trip for exactly the Retry-After duration)
    # Whitelist of network failure causes eligible for in-place retry:
    retryOnCauses:
      - "connection_reset"          # ECONNRESET, ECONNABORTED, socket hang up, EPIPE
      - "network_timeout"           # ETIMEDOUT, ESOCKETTIMEDOUT, 504 Gateway Timeout
      - "gateway_error"             # 502 Bad Gateway, 503 Service Unavailable, Cloudflare 52x
      - "rate_limit_burst"          # HTTP 429 when Retry-After <= maxRateLimitWaitMs
      - "dns_error"                 # EAI_AGAIN transient DNS resolution jitter
      # - "server_internal_error"   # HTTP 500 (disabled by default; rarely resolved by immediate retry)
  # Tier 2: Failover (Multi-Model Candidate Pool & Tier Crossing Policy)
  failover:
    enabled: true                   # Enable failover to secondary backup models
    maxAttempts: 2                  # Max candidate models to attempt across failovers
    tierCrossPolicy: "allow_escalate" # Options:
                                    # 'allow_escalate': exhaust same tier first, allow lite -> plus/pro/ultra escalation, strictly forbid downgrade
                                    # 'same_tier_only': strictly restrict failover to models within the same tier (prevents runaway costs)


# ─── Custom Model Combos ────────────────────────────────────────────────────
# Compose registered models into a virtual model name: clients send the combo
# id as `model`. Leader is picked via `selection`; failover walks the config
# order. Every member keeps its own circuit breaker / retry semantics. Combos
# bypass intent classification, the session ratchet and cross-tier escalation
# (the configured composition is authoritative). Hot-applied on console save.
# Edit visually on the console /combos page.
#
# combos:
#   - id: my-combo            # client-visible virtual model name (must not collide with 'auto*', 'default' or registered model ids)
#     selection: weighted     # priority (config order, default) | weighted (weight-random) | round_robin (rotating slots)
#     models:                 # ORDER = failover chain
#       - kimi-k2.7-code      # bare string = weight 1
#       - id: deepseek-chat   # or an object with an explicit weight:
#         weight: 3           # weight for weighted/round_robin (>= 1, default 1)

# ==============================================================================
# System One Protocol Surface (POST /v1/systemone) — OPT-IN
# ==============================================================================
# Serve TypeSafe-style decision requests (state + typed questions → typed
# answers with probabilities; no generated text). Two upstream paths:
#   * NATIVE — declare the upstream as `type: systemone` (TypeSafe Jev,
#     Alibaba Bailian decision-model-preview); requests pass through 1:1.
#   * CONVERTED — ANY registered chat/reasoning model id serves via protocol
#     conversion (one JSON-constrained chat call; answers normalized back).
#     Converted probabilities are best-effort estimates, NOT calibrated —
#     see docs/adr/0014-systemone-protocol-gateway.md.
#
# systemone:
#   defaultModel: "typesafe/jev"      # served when the request omits `model`
#
# providers:
#   - name: typesafe
#     type: systemone                 # native System One wire (not a chat executor)
#     baseUrl: "https://api.typesafe.ai/v1"
#     apiKey: "${TYPESAFE_API_KEY}"
#   # Alibaba Bailian decision model:
#   # - name: bailian-decision
#   #   type: systemone
#   #   baseUrl: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
#   #   apiKey: "${DASHSCOPE_API_KEY}"
#
# models:
#   - id: "typesafe/jev"              # client-facing id used in POST /v1/systemone
#     provider: typesafe
#     upstreamModel: "jev-latest"
#     tier: lite                      # required by the registry schema; not chat-routable
#     pricing: { input: 0.042, output: 0, cacheRead: 0 }
